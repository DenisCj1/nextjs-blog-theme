<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #1f2937;
        background: #fff;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sub {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 16px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      input[type='range'] {
        width: 160px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        height: 96px;
        font-size: 12px;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        resize: vertical;
      }
      .switch {
        cursor: pointer;
      }
      .val {
        font-weight: 700;
        color: #4f46e5;
      }
      .saved {
        font-size: 12px;
        color: #16a34a;
        height: 16px;
        margin-top: 10px;
      }
      .foot {
        margin-top: 14px;
        font-size: 11px;
        color: #9ca3af;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>↻ Loopy</h1>
    <p class="sub">One click → your AI critiques &amp; improves its own answer.</p>

    <div class="row">
      <label style="margin: 0" for="enabled">Show the Loopy button</label>
      <input class="switch" type="checkbox" id="enabled" />
    </div>

    <label for="loops">Improvement passes: <span class="val" id="loopsVal">2</span></label>
    <input type="range" id="loops" min="1" max="5" step="1" />

    <label for="instruction">What Loopy tells the AI each pass</label>
    <textarea id="instruction"></textarea>

    <div class="saved" id="saved"></div>

    <p class="foot">
      Runs inside your own ChatGPT / Claude chat. No API keys, no accounts,
      nothing leaves your browser. Each pass uses one message in your chat.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
