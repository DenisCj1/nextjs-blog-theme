<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 2000px; height: 1500px; overflow: hidden; }
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(150deg, #f3 efe 0%, #eef4f2 100%);
        background: linear-gradient(150deg, #f7f3ea 0%, #e7f1ef 100%);
        position: relative;
      }
      .top {
        text-align: center;
        padding: 70px 60px 0;
      }
      .kicker { font-size: 30px; letter-spacing: 8px; text-transform: uppercase; color: #d98b5f; font-weight: 700; }
      .title { font-family: Georgia, serif; font-size: 104px; color: #35696a; line-height: 1.05; margin: 18px 0 14px; }
      .sub { font-size: 40px; color: #4a5b5b; }
      .badges { margin-top: 30px; display: flex; gap: 20px; justify-content: center; }
      .badge { background: #3f7d78; color: #fff; font-size: 26px; font-weight: 700; padding: 14px 30px; border-radius: 999px; letter-spacing: 1px; }
      .badge.alt { background: #d98b5f; }
      .fan { position: absolute; bottom: -40px; left: 0; right: 0; height: 780px; }
      .fan img {
        position: absolute; width: 430px; border-radius: 10px;
        box-shadow: 0 30px 60px rgba(53,105,106,0.28);
        border: 1px solid #fff;
      }
      .p1 { left: 250px;  bottom: 40px; transform: rotate(-11deg); }
      .p2 { left: 620px;  bottom: 20px; transform: rotate(-4deg); z-index: 2; }
      .p3 { left: 785px;  bottom: 55px; transform: rotate(3deg); z-index: 3; }
      .p4 { right: 250px; bottom: 25px; transform: rotate(10deg); }
      .paw { position: absolute; top: 60px; left: 90px; font-size: 70px; }
      .paw2 { position: absolute; top: 90px; right: 100px; font-size: 54px; opacity: .5; }
    </style>
  </head>
  <body>
    <div class="paw">🐾</div>
    <div class="paw2">🐾</div>
    <div class="top">
      <div class="kicker">Senior Dog Care</div>
      <div class="title">Senior Dog<br />Health Tracker</div>
      <div class="sub">Track meds, weight, vet visits &amp; daily health</div>
      <div class="badges">
        <div class="badge">12 Printable Pages</div>
        <div class="badge alt">Instant Download</div>
        <div class="badge">US Letter + A4</div>
      </div>
    </div>
    <div class="fan">
      <img class="p1" src="hi06-06.png" />
      <img class="p2" src="hi05-05.png" />
      <img class="p3" src="hi03-03.png" />
      <img class="p4" src="hi09-09.png" />
    </div>
  </body>
</html>
